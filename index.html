<!DOCTYPE html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Call-markaz CRM</title><style>
:root{--bg:#0B1530;--card:#13224A;--in:#0B1530;--ln:#29407a;--a:#2F80ED;--b:#56CCF2;--t:#fff;--m:#B8C4E0;--w:#F2C94C;--r:#EB5757;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root{--bg:#EEF3FC;--card:#fff;--in:#F4F7FD;--ln:#c9d6ef;--t:#0B1530;--m:#4a5a80;--b:#1769c9}}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;min-height:100%;background:var(--bg);color:var(--t);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
h2,h3{margin:0 0 12px}button,input,select,textarea{font:inherit}
input,select,textarea{background:var(--in);border:1px solid var(--ln);color:var(--t);border-radius:10px;padding:9px 11px;width:100%}
label{display:block;color:var(--m);font-size:13px;margin:10px 0 4px}
.btn{background:var(--a);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}.btn.s{background:var(--ln);color:var(--t)}.btn.d{background:var(--r)}.btn.sm{padding:5px 9px;font-size:13px}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
nav{display:flex;gap:6px;overflow-x:auto;min-width:100%;order:3}nav button{background:none;border:0;color:var(--m);padding:8px 12px;border-radius:10px;white-space:nowrap;cursor:pointer}nav button.on{background:var(--a);color:#fff}
main{padding:14px;max-width:1200px;margin:auto}.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 4px 14px #0003}
.grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}@media(min-width:800px){.g5{grid-template-columns:repeat(5,1fr)}.pg{grid-template-columns:repeat(4,1fr)}nav{min-width:0;order:0;flex:1}}
.k{color:var(--m);font-size:12px}.v{font-size:20px;font-weight:700;color:var(--b)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar>*{flex:1;min-width:130px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--ln);font-size:14px}th{color:var(--m);font-weight:500}
.pc{cursor:pointer;text-align:center}.em{font-size:54px;line-height:1.3}.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--ln)}.ok{background:#1b6b4a;color:#fff}.lo{background:#7a6212;color:#F2C94C}.no{background:#7a2a2a;color:#ffb3b3}
#m{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:20;padding:20px 10px}.md{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:520px}
.row{display:flex;gap:6px;margin-top:12px}.warn{background:#4a3d0e;color:#F2C94C;border-radius:12px;padding:10px;margin-bottom:12px}.err{color:var(--r);margin:8px 0 0}
.bb{height:9px;border-radius:5px;background:var(--a);margin:4px 0}.c{text-align:center;padding:40px 10px;color:var(--m)}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script></head><body><div id="app"><p class="c">Yuklanmoqda…</p></div><div id="m" onclick="if(event.target==this)cl()"></div><script>
const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID(),E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g," ")+" so’m",ago=d=>new Date(Date.now()-d*864e5).toISOString().slice(0,10),today=()=>ago(0);
const ST={yangi:"Yangi",qongiroq:"Qo’ng’iroq qilindi",qiziqdi:"Qiziqdi",rad:"Rad etdi",sotildi:"Sotildi"};
const SB=supabase.createClient("https://enrzypmmsgrnwbywsswr.supabase.co","sb_publishable_15cEdU0Xbdmjd48DFsBeNw_lp0pQeLl");
let me=null,C={products:[],stock:[],leads:[],sales:[],ops:[],profiles:[]},N={},page="dash",F={st:"",op:"",pr:"",q:""},RG="30";
const pn=id=>(C.products.find(p=>p.id==id)||{}).nom||"—",qty=id=>(C.stock.find(s=>s.id==id)||{}).q||0,lid=id=>C.leads.find(l=>l.id==id)||{};
const nm=id=>(N[id]&&N[id].name)||"—",hol=q=>q>10?["Yetarli","ok"]:q>0?["Kam qoldi","lo"]:["Tugagan","no"],ops=()=>C.ops,vl=()=>me.admin?C.leads:C.leads.filter(l=>l.op==me.id),vs=()=>me.admin?C.sales:C.sales.filter(s=>s.op==me.id);
async function reload(){const r=await Promise.all(["products","leads","sales","profiles"].map(t=>SB.from(t).select("*")));const bad=r.find(x=>x.error);if(bad){alert(bad.error.message);return}
C.products=r[0].data;C.stock=C.products.map(p=>({id:p.id,q:p.q}));C.leads=r[1].data;C.sales=r[2].data;C.profiles=r[3].data;N={};C.profiles.forEach(p=>N[p.id]=p);C.ops=C.profiles.filter(p=>p.role=="op");if($("#ll"))dl();else draw()}
const nz=d=>{const o={...d};if("op"in o&&!o.op)o.op=null;if("pr"in o&&!o.pr)o.pr=null;return o};
async function wr(t,id,d){const r=t=="stock"?await SB.from("products").update({q:d.q}).eq("id",id):await SB.from(t).upsert({id,...nz(d)});if(r.error)alert(r.error.message);await reload()}
async function up(t,id,d){const r=await SB.from(t).update(nz(d)).eq("id",id);if(r.error)alert(r.error.message);await reload()}
function loginView(e=""){$("#app").innerHTML=`<main style="max-width:380px;margin-top:8vh"><div class=card><h2>📞 Call-markaz CRM</h2><label>Ism (ro’yxatdan o’tishda)</label><input id=nn><label>Email</label><input id=em type=email><label>Parol (kamida 6 belgi)</label><input id=pw type=password><p class=err id=le>${E(e)}</p><div class=row><button class=btn onclick="auth(0)">Kirish</button><button class="btn s" onclick="auth(1)">Ro’yxatdan o’tish</button></div></div></main>`}
async function auth(su){const em=$("#em").value.trim(),pw=$("#pw").value,r=su?await SB.auth.signUp({email:em,password:pw,options:{data:{name:$("#nn").value.trim()}}}):await SB.auth.signInWithPassword({email:em,password:pw});if(r.error){$("#le").textContent=r.error.message;return}if(su&&!r.data.session)$("#le").textContent="Emailingizga tasdiq xati yuborildi."}
async function boot(){const s=(await SB.auth.getSession()).data.session;if(!s){me=null;loginView();return}const r=await SB.from("profiles").select("*").eq("id",s.user.id).single();if(r.error||!r.data){loginView("Profil topilmadi");return}
me={id:s.user.id,role:r.data.role,admin:r.data.role=="admin"};if(me.role=="pending"){$("#app").innerHTML=`<main style="max-width:420px;margin-top:8vh"><div class=card><h2>⏳ Tasdiqlash kutilmoqda</h2><p>Hisobingiz yaratildi. Admin tasdiqlagach CRM ochiladi.</p><button class="btn s" onclick="SB.auth.signOut()">Chiqish</button></div></main>`;return}await reload()}
SB.auth.onAuthStateChange(e=>{if(e!="TOKEN_REFRESHED")setTimeout(boot,0)});
setInterval(()=>{if(me&&me.role!="pending"&&$("#m").style.display!="flex")reload()},30000);


function dist(){const o=ops(),u=C.leads.filter(l=>!l.op);if(!o.length||!u.length){alert("Biriktirilmagan lid yoki operator yo’q");return}Promise.all(u.map((l,i)=>SB.from("leads").update({op:o[i%o.length].id}).eq("id",l.id))).then(reload)}
function csv(f){if(!f)return;const r=new FileReader();r.onload=async()=>{const rows=[];r.result.split(/\r?\n/).forEach((ln,i)=>{const c=ln.split(",").map(x=>x.trim());if(!c[0]||(i==0&&c[0].toLowerCase()=="ism"))return;rows.push({ism:c[0],tel:c[1]||"",ig:c[2]||"",manba:c[3]||"CSV",izoh:c[4]||""})});if(rows.length){const x=await SB.from("leads").insert(rows);if(x.error)alert(x.error.message)}reload()};r.readAsText(f)}
async function doSale(id){const pid=$("#s1").value,q=+$("#s2").value,n=+$("#s3").value;if(!(q>0)||!(n>=0)){$("#fe").textContent="Miqdor va narxni to’g’ri kiriting";return}if(qty(pid)<q){$("#fe").textContent=`Xato: omborda yetarli emas (qoldiq: ${qty(pid)})`;return}const r=await SB.rpc("sell",{p_lead:id,p_pr:pid,p_q:q,p_narx:n});if(r.error){$("#fe").textContent=r.error.message;return}cl();reload()}
function pDel(id){om(`<div class=md><h2>O’chirishni tasdiqlang</h2><p>${E(pn(id))} o’chiriladi. Davom etasizmi?</p><div class=row><button class="btn d" onclick="delP('${id}')">Ha, o’chirish</button><button class="btn s" onclick="cl()">Yo’q</button></div></div>`)}
async function delP(id){await SB.from("products").delete().eq("id",id);cl();reload()}
async function setRole(id,role){const r=await SB.from("profiles").update({role}).eq("id",id);if(r.error)alert(r.error.message);reload()}
function opsP(){const L={admin:"Admin",op:"Operator",pending:"Kutilmoqda"};return`<h2>👥 Operatorlar</h2><div class=card><p>Operator CRM manziliga kirib “Ro’yxatdan o’tish”ni bosadi. Hisob “Kutilmoqda” holatida paydo bo’ladi, siz tasdiqlaguningizcha hech narsani ko’ra olmaydi.</p></div><div class="card tw" style="margin-top:12px"><table><tr><th>Ism</th><th>Email</th><th>Holat</th><th>Lidlar</th><th></th></tr>${C.profiles.filter(p=>p.id!=me.id).map(p=>`<tr><td>${E(p.name)}</td><td>${E(p.email)}</td><td><span class="tag ${p.role=="op"?"ok":"lo"}">${L[p.role]}</span></td><td>${C.leads.filter(l=>l.op==p.id).length}</td><td>${p.role=="op"?`<button class="btn d sm" onclick="setRole('${p.id}','pending')">Bloklash</button>`:`<button class="btn sm" onclick="setRole('${p.id}','op')">Tasdiqlash</button>`}</td></tr>`).join("")||"<tr><td>Hali hisob yo’q</td></tr>"}</table></div>`}

function draw(){const N_=[["dash","🏠 Dashboard"],["leads","📞 Lidlar"],["prod","📦 Mahsulotlar"],["ware","🏬 Ombor"],["sales","💰 Sotuvlar"],["stat","📊 Statistika"]];if(me.admin)N_.push(["ops","👥 Operatorlar"]);
$("#app").innerHTML=`<header><b>📞 Call-markaz CRM</b><span class=k style="flex:1">${E(nm(me.id))} · ${me.admin?"Admin":"Operator"}</span><button class="btn s sm" onclick="SB.auth.signOut()">Chiqish</button><nav>${N_.map(n=>`<button class="${page==n[0]?"on":""}" onclick="page='${n[0]}';draw()">${n[1]}</button>`).join("")}</nav></header><main>${({dash,leads,prod,ware,sales,stat,ops:opsP})[page]()}</main>`}
const cards=(ls,ss)=>{const r=ss.reduce((a,s)=>a+s.q*s.narx,0);return`<div class="grid g5">${[["Jami lid",ls.length],["Gaplashilgan lid",ls.filter(l=>l.st!="yangi").length],["Jami sotuv",ss.length],["Jami tushum",fmt(r)],["O’rtacha chek",fmt(ss.length?r/ss.length:0)]].map(c=>`<div class=card><div class=k>${c[0]}</div><div class=v>${c[1]}</div></div>`).join("")}</div>`};
function dash(){const low=C.products.filter(p=>qty(p.id)<10);return`<h2>🏠 Dashboard</h2>${low.length?`<div class=warn>⚠️ Qoldig’i 10 dan kam: ${low.map(p=>`${E(p.nom)} (${qty(p.id)})`).join(", ")}</div>`:""}${cards(vl(),vs())}${!C.products.length&&me.admin?`<p class=c>Boshlash uchun “Mahsulotlar” bo’limida mahsulot qo’shing, so’ng lid qo’shing yoki CSV import qiling. Operatorlar o’zlari ro’yxatdan o’tadi, siz ularni tasdiqlaysiz.</p>`:""}`}
/* LIDLAR */
function leads(){const o=t=>`<option value="">${t}</option>`;return`<h2>📞 Lidlar</h2><div class=bar><select onchange="F.st=this.value;dl()">${o("Status")}${Object.entries(ST).map(e=>`<option value=${e[0]}>${e[1]}</option>`).join("")}</select>${me.admin?`<select onchange="F.op=this.value;dl()">${o("Operator")}${ops().map(u=>`<option value=${u.id}>${E(nm(u.id))}</option>`).join("")}</select>`:""}<select onchange="F.pr=this.value;dl()">${o("Mahsulot")}${C.products.map(p=>`<option value=${p.id}>${E(p.nom)}</option>`).join("")}</select><input placeholder="🔍 Telefon bo’yicha" oninput="F.q=this.value;dl()"></div>${me.admin?`<div class=bar><button class=btn onclick="leadForm()">➕ Lid qo’shish</button><label class="btn s" style="margin:0;text-align:center;color:#fff">📥 CSV import<input type=file accept=".csv,text/csv" hidden onchange="csv(this.files[0])"></label><button class=btn onclick="dist()">⚡ Avtomatik taqsimlash</button></div>`:""}<div class="card tw" id=ll>${lt()}</div>`}
const dl=()=>$("#ll").innerHTML=lt();
function lt(){const f=vl().filter(l=>(!F.st||l.st==F.st)&&(!F.op||l.op==F.op)&&(!F.pr||l.pr==F.pr)&&String(l.tel||"").replace(/\s/g,"").includes(F.q.replace(/\s/g,""))).sort((a,b)=>(b.sana||"").localeCompare(a.sana||""));
return`<table><tr><th>Ism</th><th>Telefon</th><th>Instagram</th><th>Mahsulot</th><th>Status</th>${me.admin?"<th>Operator</th>":""}<th>Izoh</th></tr>${f.map(l=>`<tr><td>${E(l.ism)}</td><td>${E(l.tel)}</td><td>${E(l.ig)}</td><td>${E(pn(l.pr))}</td><td><select style="min-width:140px" onchange="setSt('${l.id}',this.value)">${Object.entries(ST).map(e=>`<option value=${e[0]} ${l.st==e[0]?"selected":""}>${e[1]}</option>`).join("")}</select></td>${me.admin?`<td><select onchange="up('leads','${l.id}',{op:this.value})"><option value="">— biriktirilmagan</option>${ops().map(u=>`<option value=${u.id} ${l.op==u.id?"selected":""}>${E(nm(u.id))}</option>`).join("")}</select></td>`:""}<td><input value="${E(l.izoh)}" onchange="up('leads','${l.id}',{izoh:this.value})"></td></tr>`).join("")||"<tr><td>Lid topilmadi</td></tr>"}</table>`}
function setSt(id,v){if(v=="sotildi"){saleForm(id);return}up("leads",id,{st:v})}
function leadForm(){om(`<div class=md><h2>➕ Yangi lid</h2><label>Ism</label><input id=f1><label>Telefon</label><input id=f2><label>Instagram</label><input id=f3><label>Manba</label><input id=f4><label>Qiziqqan mahsulot</label><select id=f5><option value="">—</option>${C.products.map(p=>`<option value=${p.id}>${E(p.nom)}</option>`).join("")}</select><label>Izoh</label><textarea id=f6></textarea><p class=err id=fe></p><div class=row><button class=btn onclick="addLead()">Saqlash</button><button class="btn s" onclick="cl()">Bekor</button></div></div>`)}
function addLead(){if(!$("#f1").value.trim()||!$("#f2").value.trim()){$("#fe").textContent="Ism va telefon majburiy";return}wr("leads",uid(),{ism:$("#f1").value.trim(),tel:$("#f2").value.trim(),ig:$("#f3").value,manba:$("#f4").value,pr:$("#f5").value,izoh:$("#f6").value,st:"yangi",op:"",sana:today()});cl()}
/* SOTUV */
function saleForm(id){const l=lid(id),p=C.products.find(x=>x.id==l.pr)||C.products[0];if(!p){alert("Avval mahsulot qo’shing");draw();return}
om(`<div class=md><h2>💰 Sotuv: ${E(l.ism)}</h2><label>Mahsulot</label><select id=s1 onchange="$('#s3').value=C.products.find(p=>p.id==this.value).narx">${C.products.map(x=>`<option value=${x.id} ${x.id==p.id?"selected":""}>${E(x.nom)} (qoldiq: ${qty(x.id)})</option>`).join("")}</select><label>Nechta dona</label><input id=s2 type=number min=1 value=1><label>Narx (so’m)</label><input id=s3 type=number value=${p.narx}><p class=err id=fe></p><div class=row><button class=btn onclick="doSale('${id}')">Saqlash</button><button class="btn s" onclick="cl();draw()">Bekor</button></div></div>`)}
function sales(){return`<h2>💰 Sotuvlar</h2><div class="card tw"><table><tr><th>Sana</th><th>Lid</th><th>Mahsulot</th><th>Dona</th><th>Narx</th><th>Operator</th></tr>${vs().slice().sort((a,b)=>(b.sana||"").localeCompare(a.sana||"")).map(s=>`<tr><td>${s.sana}</td><td>${E(lid(s.lid).ism)}</td><td>${E(pn(s.pr))}</td><td>${s.q}</td><td>${fmt(s.narx)}</td><td>${E(nm(s.op))}</td></tr>`).join("")||"<tr><td>Sotuv yo’q</td></tr>"}</table></div>`}
/* MAHSULOT */
let PQ="";
function prod(){return`<h2>📦 Mahsulotlar</h2><div class=bar><input placeholder="🔍 Nom bo’yicha" value="${E(PQ)}" oninput="PQ=this.value;$('#pl').innerHTML=pc()">${me.admin?`<button class=btn onclick="pForm()">➕ Mahsulot qo’shish</button>`:""}</div><div class="grid pg" id=pl>${pc()}</div>`}
const pc=()=>C.products.filter(p=>String(p.nom).toLowerCase().includes(PQ.toLowerCase())).map(p=>{const q=qty(p.id),h=hol(q);return`<div class="card pc" onclick="pView('${p.id}')"><div class=em>${E(p.emoji||"📦")}</div><b>${E(p.nom)}</b><div class=v style="font-size:15px">${fmt(p.narx)}</div><span class="tag ${h[1]}">${q} dona · ${h[0]}</span></div>`}).join("")||"<p>Topilmadi</p>";
function pView(id){const p=C.products.find(x=>x.id==id),q=qty(id),h=hol(q);om(`<div class=md><div class=em style="text-align:center">${E(p.emoji||"📦")}</div><h2>${E(p.nom)}</h2><div class=v>${fmt(p.narx)}</div><p>${E(p.tavsif)}</p>${(p.fn||[]).length?`<b>Funksiyalari</b><ul>${p.fn.map(f=>`<li>${E(f)}</li>`).join("")}</ul>`:""}<p>Ombor: <b>${q}</b> dona <span class="tag ${h[1]}">${h[0]}</span></p><div class=row>${me.admin?`<button class=btn onclick="pForm('${id}')">✏️ Tahrirlash</button><button class="btn d" onclick="pDel('${id}')">🗑 O’chirish</button>`:""}<button class="btn s" onclick="cl()">Yopish</button></div></div>`)}
function pForm(id){const p=C.products.find(x=>x.id==id)||{nom:"",narx:"",emoji:"📦",tavsif:"",fn:[]};om(`<div class=md><h2>${id?"✏️ Tahrirlash":"➕ Mahsulot qo’shish"}</h2><label>Nom</label><input id=p1 value="${E(p.nom)}"><label>Emoji (rasm o’rnida)</label><input id=p2 value="${E(p.emoji)}"><label>Narx (so’m)</label><input id=p3 type=number value="${p.narx}"><label>Ombor qoldig’i</label><input id=p4 type=number value="${id?qty(id):0}"><label>Tavsif</label><textarea id=p5>${E(p.tavsif)}</textarea><label>Funksiyalar (vergul bilan)</label><input id=p6 value="${E((p.fn||[]).join(", "))}"><p class=err id=fe></p><div class=row><button class=btn onclick="pSave('${id||""}')">Saqlash</button><button class="btn s" onclick="cl()">Bekor</button></div></div>`)}
async function pSave(id){const nom=$("#p1").value.trim(),narx=+$("#p3").value;if(!nom||!(narx>0)){$("#fe").textContent="Nom va narx majburiy";return}id=id||uid();try{await wr("products",id,{nom,emoji:$("#p2").value||"📦",narx,tavsif:$("#p5").value,fn:$("#p6").value.split(",").map(x=>x.trim()).filter(Boolean)});await wr("stock",id,{q:Math.max(0,+$("#p4").value||0)});cl()}catch(e){$("#fe").textContent="Saqlab bo’lmadi"}}
function ware(){return`<h2>🏬 Ombor</h2><div class="card tw"><table><tr><th>Mahsulot</th><th>Qoldiq</th><th>Holat</th></tr>${C.products.map(p=>{const q=qty(p.id),h=hol(q);return`<tr><td>${E(p.nom)}</td><td>${me.admin?`<input type=number min=0 style="width:90px" value=${q} onchange="wr('stock','${p.id}',{q:Math.max(0,+this.value)})">`:q}</td><td><span class="tag ${h[1]}">${h[0]}</span></td></tr>`}).join("")||"<tr><td>Mahsulot yo’q</td></tr>"}</table></div>${me.admin?"":`<p class=k>Operatorlar qoldiqni o’zgartira olmaydi — u faqat sotuv orqali kamayadi.</p>`}`}
/* STATISTIKA */
function stat(){const inR=d=>RG=="all"||(d||"")>=ago(+RG),ls=vl().filter(l=>inR(l.sana)),ss=vs().filter(s=>inR(s.sana)),us=me.admin?ops():[{id:me.id}];
const pr=C.products.map(p=>{const q=ls.filter(l=>l.pr==p.id&&(l.st=="qiziqdi"||l.st=="sotildi")).length,sp=ss.filter(s=>s.pr==p.id);return{n:p.nom,q,u:sp.reduce((a,s)=>a+s.q,0),rev:sp.reduce((a,s)=>a+s.q*s.narx,0),cv:q?Math.round(sp.length/q*100):0}});
const op=us.map(o=>{const a=ls.filter(l=>l.op==o.id),t=a.filter(l=>l.st!="yangi").length,sp=ss.filter(s=>s.op==o.id);return{n:nm(o.id),a:a.length,t,s:sp.length,rev:sp.reduce((x,s)=>x+s.q*s.narx,0),cv:t?Math.round(sp.length/t*100):0}}).sort((x,y)=>y.rev-x.rev),mr=Math.max(1,...op.map(o=>o.rev));
return`<h2>📊 Statistika</h2><div class=bar><select onchange="RG=this.value;draw()">${[["0","Bugun"],["7","7 kun"],["30","30 kun"],["all","Hammasi"]].map(x=>`<option value=${x[0]} ${RG==x[0]?"selected":""}>${x[1]}</option>`).join("")}</select></div>${cards(ls,ss)}
<h3 style="margin-top:18px">Mahsulotlar bo’yicha</h3><div class="card tw"><table><tr><th>Mahsulot</th><th>Qiziqish</th><th>Sotilgan</th><th>Tushum</th><th>Konversiya</th></tr>${pr.sort((x,y)=>y.u-x.u).map((x,i)=>`<tr><td>${i+1}. ${E(x.n)}</td><td>${x.q}</td><td>${x.u}</td><td>${fmt(x.rev)}</td><td>${x.cv}%</td></tr>`).join("")||"<tr><td>—</td></tr>"}</table></div>
<h3 style="margin-top:18px">Operatorlar bo’yicha</h3><div class="card tw"><table><tr><th>Operator</th><th>Biriktirilgan</th><th>Gaplashilgan</th><th>Sotuv</th><th>Tushum</th><th>Konversiya</th></tr>${op.map((o,i)=>`<tr><td>${i+1}. ${E(o.n)}</td><td>${o.a}</td><td>${o.t}</td><td>${o.s}</td><td>${fmt(o.rev)}</td><td>${o.cv}%</td></tr>`).join("")||"<tr><td>—</td></tr>"}</table>${op.map(o=>`<div class=k>${E(o.n)}</div><div class=bb style="width:${o.rev/mr*100}%"></div>`).join("")}</div>`}
function om(h){const m=$("#m");m.innerHTML=h;m.style.display="flex"}function cl(){$("#m").style.display="none"}
</script></body></html>
